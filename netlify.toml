[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.15.0"

# ---------------------------------------------------------------------------
# Redirects. Order matters: Netlify uses the first rule that matches.
# ---------------------------------------------------------------------------

# Canonical host is the apex domain.
[[redirects]]
  from = "https://www.thesouthernrebellion.co.za/*"
  to = "https://thesouthernrebellion.co.za/:splat"
  status = 301
  force = true

# The old site was a WordPress "Coming Soon" page with no content URLs.
# These catch WordPress paths that bots and old bookmarks still request.
[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/wp-content/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/feed/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap.xml"
  status = 301
  force = true

# The site is two pages: "/" (hero and six sections) and "/contact" (both forms).
# Short links for Instagram bios, and the old booking URLs, go to the contact page.
# (There is deliberately no rule for "/contact": it is a real page.)
[[redirects]]
  from = "/book"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/book/*"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/booking"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/bookings"
  to = "/contact"
  status = 301

# The old one-page-per-topic routes now live as sections of "/".
# NEEDS DEPLOY PREVIEW: check that Netlify keeps the #fragment in these Location headers
# (curl -sI https://<preview>/visit). If it does not, change each "to" below to "/".
[[redirects]]
  from = "/artists"
  to = "/#artists"
  status = 301

[[redirects]]
  from = "/artists/*"
  to = "/#artist-:splat"
  status = 301

[[redirects]]
  from = "/flash"
  to = "/#flash"
  status = 301

[[redirects]]
  from = "/piercing"
  to = "/#piercing"
  status = 301

[[redirects]]
  from = "/aftercare"
  to = "/#aftercare"
  status = 301

[[redirects]]
  from = "/visit"
  to = "/#visit"
  status = 301

# Fallback. Every real route is prerendered to its own HTML file, so this only
# catches unknown URLs. It serves the 404 page with a 404 status rather than
# index.html with a 200 (see README, "Routing").
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Image filenames include a hash of the source file, so they never change in place.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
